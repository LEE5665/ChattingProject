spring.application.name=backend
server.port=8081

# PostgreSQL (Docker Compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/chatting_db
spring.datasource.username=chatting_user
spring.datasource.password=chatting_password

# JPA: use update for local development; migrations can manage production schemas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
livekit.url=ws://localhost:7880
livekit.api-key=devkey
livekit.api-secret=secret
