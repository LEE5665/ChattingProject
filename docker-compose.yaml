services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    container_name: chatting-postgres
    environment:
      POSTGRES_DB: chatting_db
      POSTGRES_USER: chatting_user
      POSTGRES_PASSWORD: chatting_password
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:5
    container_name: chatting-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8888:8080"
    depends_on:
      - postgres

  livekit:
    image: livekit/livekit-server:v1.13.9
    container_name: chatting-livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--dev"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro

volumes:
  postgres_data:
